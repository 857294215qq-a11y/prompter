name: 编译安卓 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ui-v3.css'
      - 'ui-v3.js'
      - 'assets/**'
      - 'android/**'
      - 'scripts/**'
      - 'icons/**'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 安装依赖并打包网页
        run: |
          npm ci
          npm test
          npm run build:web
          npx cap sync android

      - name: 准备签名密钥（没有设置就用调试密钥）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/prompter.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/prompter.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "使用固定签名密钥"
          else
            echo "::warning::没有设置签名密钥，本次 APK 用调试密钥签名，之后换了密钥就不能覆盖安装"
          fi

      - name: 编译 APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 整理文件
        run: cp android/app/build/outputs/apk/release/app-release.apk prompter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: prompter-apk
          path: prompter.apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" prompter.apk \
            --title "提词器 APK #${{ github.run_number }}" \
            --notes "提交 ${GITHUB_SHA::7}。手机上下载 prompter.apk 直接安装；覆盖安装即可更新，稿子和设置不会丢。" \
            --latest
